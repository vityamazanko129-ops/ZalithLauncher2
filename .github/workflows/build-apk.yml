name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Собрать APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: zalith-apk
          path: '**/build/outputs/apk/**/*.apk'
